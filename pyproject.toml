[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumi-hpc-qc"
version = "1.0.0b1"
description = "Modular HPC + Quantum Computing framework for LUMI and VTT Q50"
requires-python = ">=3.10"
dependencies = [
    "qiskit>=2.0",
    "qiskit-aer>=0.15",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
molecular = ["qiskit-nature>=0.7", "pyscf>=2.4"]
qcut = ["qcut"]
nvidia = ["cudaq"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
lumi-vqa = "lumi_hpc_qc.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring Aer GPU backend",
    "slurm: tests requiring SLURM scheduler",
]
