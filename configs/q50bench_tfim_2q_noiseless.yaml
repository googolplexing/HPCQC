#
# Q50 Benchmark: tfim_2q — noiseless Aer GPU simulation
# Baseline for comparison with noisy and QPU results.
#
model: byo
model_params:
  hamiltonian_file: examples/byo_tfim_2q_q50.json

ansatz: su2
ansatz_params:
  reps: 2
  entanglement: linear

optimizer: l_bfgs_b
optimizer_params:
  maxiter: 200
  gtol: 1.0e-6

gradient: parameter_shift

initializer: random
initializer_params:
  seed: 42

backend: aer_gpu
backend_params:
  method: statevector
precision: double
mode: interactive

checkpoint:
  enabled: true
  directory: checkpoints
  interval: 50

output_dir: results
