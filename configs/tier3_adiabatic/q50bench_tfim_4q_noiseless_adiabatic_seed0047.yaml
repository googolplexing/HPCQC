model: byo
model_params:
  hamiltonian_file: examples/byo_tfim_4q_q50.json

ansatz: su2
ansatz_params:
  reps: 1
  entanglement: linear

optimizer: l_bfgs_b
optimizer_params:
  maxiter: 400
  gtol: 1.0e-8

gradient: parameter_shift

initializer: adiabatic
initializer_params:
  seed: 47

backend: aer_gpu
backend_params:
  method: statevector

precision: double
mode: interactive

checkpoint:
  enabled: true
  directory: checkpoints
  interval: 50

output_dir: results/tier3_adiabatic/seed_0047
