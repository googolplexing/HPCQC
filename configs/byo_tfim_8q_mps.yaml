model: byo
model_params:
  hamiltonian_file: examples/byo_transverse_ising_8q.json
ansatz: su2
ansatz_params:
  reps: 3
  entanglement: linear
optimizer: l_bfgs_b
optimizer_params:
  maxiter: 200
  gtol: 1.0e-6
gradient: parameter_shift
initializer: random
initializer_params:
  seed: 42
backend: aer_cpu
backend_params:
  method: matrix_product_state
  max_bond_dimension: 256
precision: double
mode: interactive
checkpoint:
  enabled: true
  directory: checkpoints
  interval: 50
output_dir: results
