model: heisenberg
model_params:
  lattice_rows: 3
  lattice_cols: 4
  jx: 1.0
  jy: 1.0
  jz: 1.0
  h_field: 0.0
ansatz: hva
ansatz_params:
  reps: 3
optimizer: l_bfgs_b
optimizer_params:
  maxiter: 1000
  gtol: 1.0e-06
gradient: parameter_shift
initializer: adiabatic
initializer_params:
  seed: 42
  adiabatic_steps: 20
  adiabatic_max_iter: 300
backend: aer_gpu
backend_params:
  method: statevector
precision: double
mode: interactive
checkpoint:
  enabled: true
  directory: checkpoints
  interval: 50
output_dir: results
