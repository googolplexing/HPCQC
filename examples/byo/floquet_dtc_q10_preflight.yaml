# q10 BYO preflight smoke: trimmed sibling of floquet_dtc_q10_sweep.yaml
# (2 seeds x 8 kicks, both arms) for fast end-to-end validation + per-task
# timing of the q10 device-calibrated sweep path before the full 40x60 run.
# Same factory / disorder file / calibration as the full config.
sweep:
  experiments:
    - type: byo_circuit
      label: floquet_dtc_q10_preflight
      circuit_script: examples/byo/floquet_dtc.py
      circuit_function: build_circuit
      fixed:
        num_qubits: 10
        epsilon: 0.03
      grid:
        num_kicks: {range: [0, 8]}        # 0..7, trimmed
      disorder:
        source: file
        file: examples/byo/floquet_disorder_q10.json
        initial_state: 3
      disorder_gates: [rz, rzz]
      seed_list: [0, 1]                    # trimmed from 40
      shots: 1000
      noise_configs:
        - noiseless
        - device_calibrated
  calibrations:
    - examples/q50_calibration_20260524_08c3c70f.json
